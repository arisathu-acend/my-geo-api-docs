<!DOCTYPE html>
<html lang="th" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Geo Fencing API Documentation</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b1018;
            --panel: #111927;
            --input: #0d1522;
            --line: #2a3749;
            --strong: #43536b;
            --text: #e8eef7;
            --muted: #afbdd0;
            --accent: #a5b4fc;
            --section: #192536;
            --code: #080f1c
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #f4f6fa;
            --panel: #fff;
            --input: #fff;
            --line: #dce3ed;
            --strong: #aab8cb;
            --text: #172033;
            --muted: #53647b;
            --accent: #4338ca;
            --section: #edf2f8;
            --code: #eef2f7
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif
        }

        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px max(20px, calc((100vw - 1232px)/2));
            background: var(--panel);
            border-bottom: 1px solid var(--line)
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px
        }

        .mark {
            display: grid;
            place-items: center;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-weight: 800
        }

        .brand strong {
            display: block;
            font-size: 15px
        }

        .brand small {
            color: var(--muted);
            font-size: 12px
        }

        .actions {
            display: flex;
            gap: 10px;
            align-items: center
        }

        .site-button {
            display: inline-flex;
            align-items: center;
            text-decoration: none;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 9px 12px;
            border: 1px solid var(--strong);
            border-radius: 8px;
            background: var(--input);
            color: var(--text);
            cursor: pointer
        }

        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px
        }

        main {
            max-width: 1280px;
            margin: auto;
            padding: 28px 24px 64px
        }

        .hero {
            margin-bottom: 24px
        }

        .eyebrow {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .12em;
            color: var(--accent)
        }

        h1 {
            font-size: clamp(24px, 4vw, 34px);
            margin: 10px 0
        }

        .hero p {
            color: var(--muted);
            line-height: 1.7;
            margin: 0
        }

        .docs {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: var(--panel);
            overflow: hidden
        }

        #load-error {
            margin: 16px 24px;
            padding: 16px;
            border: 1px solid #f87171;
            border-radius: 8px;
            color: var(--text);
            line-height: 1.7
        }

        [hidden] {
            display: none !important
        }

        .swagger-ui {
            color: var(--text);
            font-family: inherit
        }

        .swagger-ui .wrapper {
            max-width: none;
            padding-inline: 0
        }

        .swagger-ui .info {
            margin: 0;
            padding: 28px 24px;
            border-bottom: 1px solid var(--line)
        }

        .swagger-ui .info .title,
        .swagger-ui .info p,
        .swagger-ui .info li,
        .swagger-ui .info h1,
        .swagger-ui .info h2,
        .swagger-ui .info h3,
        .swagger-ui .info .base-url {
            color: var(--text)
        }

        .swagger-ui .scheme-container {
            margin: 0;
            padding: 20px 24px;
            background: transparent;
            border-bottom: 1px solid var(--line);
            box-shadow: none
        }

        .swagger-ui .opblock-tag-section {
            padding: 0 24px 8px
        }

        .swagger-ui .opblock-tag {
            margin: 0 0 16px;
            padding: 20px 0 14px;
            border-bottom: 1px solid var(--line);
            font-size: 18px;
            color: var(--text)
        }

        .swagger-ui .opblock-tag:hover {
            background: transparent
        }

        .swagger-ui .opblock {
            margin: 0 0 16px;
            border-radius: 10px;
            box-shadow: none;
            overflow: hidden;
            background: var(--input)
        }

        .swagger-ui .opblock .opblock-summary {
            padding: 12px 16px;
            gap: 10px
        }

        .swagger-ui .opblock .opblock-summary-path {
            min-width: 0;
            overflow-wrap: anywhere
        }

        .swagger-ui .opblock .opblock-summary-path,
        .swagger-ui .opblock .opblock-summary-path a,
        .swagger-ui .opblock .opblock-summary-description {
            color: var(--text)
        }

        .swagger-ui .opblock .opblock-summary-method {
            min-width: 72px;
            flex-shrink: 0;
            border: 0;
            border-radius: 6px;
            color: #fff;
            text-shadow: none
        }

        .swagger-ui .opblock.opblock-get .opblock-summary-method {
            background: #2563eb
        }

        .swagger-ui .opblock.opblock-post .opblock-summary-method {
            background: #15803d
        }

        .swagger-ui .opblock.opblock-put .opblock-summary-method {
            background: #b45309
        }

        .swagger-ui .opblock.opblock-patch .opblock-summary-method {
            background: #7e22ce
        }

        .swagger-ui .opblock.opblock-delete .opblock-summary-method {
            background: #b91c1c
        }

        .swagger-ui .opblock .opblock-body {
            padding: 0;
            border-top: 0
        }

        .swagger-ui .opblock .opblock-section-header {
            padding: 14px 20px;
            min-height: 56px;
            background: var(--section);
            box-shadow: none;
            border-bottom: 1px solid var(--line)
        }

        .swagger-ui .opblock .opblock-section-header h4,
        .swagger-ui .opblock .opblock-section-header label {
            color: var(--text)
        }

        .swagger-ui .parameters-container {
            padding: 0 20px 16px
        }

        .swagger-ui .opblock-description-wrapper,
        .swagger-ui .opblock-external-docs-wrapper,
        .swagger-ui .opblock-title_normal {
            padding: 16px 20px
        }

        .swagger-ui .opblock .responses-wrapper {
            padding: 0
        }

        .swagger-ui .opblock .responses-inner {
            padding: 16px 20px 20px
        }

        .swagger-ui .opblock .execute-wrapper {
            padding: 16px 20px 20px
        }

        .swagger-ui table.parameters,
        .swagger-ui table.responses-table {
            width: 100%;
            margin: 0;
            background: transparent;
            border-radius: 0
        }

        .swagger-ui table thead tr th,
        .swagger-ui table thead tr td {
            padding: 14px 12px;
            color: var(--muted);
            border-bottom: 1px solid var(--line)
        }

        .swagger-ui table tbody tr td {
            padding: 16px 12px;
            vertical-align: top;
            color: var(--text);
            border-bottom: 1px solid var(--line)
        }

        .swagger-ui table tr>:first-child {
            padding-left: 0
        }

        .swagger-ui table tr>:last-child {
            padding-right: 0
        }

        .swagger-ui .renderedMarkdown,
        .swagger-ui .renderedMarkdown p,
        .swagger-ui .renderedMarkdown li,
        .swagger-ui .renderedMarkdown h1,
        .swagger-ui .renderedMarkdown h2,
        .swagger-ui .renderedMarkdown h3,
        .swagger-ui .markdown p,
        .swagger-ui .parameter__name,
        .swagger-ui .parameter__type,
        .swagger-ui .parameter__in,
        .swagger-ui .parameter__deprecated,
        .swagger-ui .response-col_status,
        .swagger-ui .response-col_links,
        .swagger-ui .response-col_description,
        .swagger-ui .responses-inner h4,
        .swagger-ui .responses-inner h5,
        .swagger-ui label,
        .swagger-ui .tab li,
        .swagger-ui .model,
        .swagger-ui .model-title,
        .swagger-ui .model-toggle,
        .swagger-ui .prop-name {
            color: var(--text)
        }

        .swagger-ui .renderedMarkdown a,
        .swagger-ui .info a {
            color: var(--accent)
        }

        .swagger-ui .parameter__extension,
        .swagger-ui .parameter__default,
        .swagger-ui .prop-format {
            color: var(--muted)
        }

        .swagger-ui input[type=text],
        .swagger-ui input[type=password],
        .swagger-ui input[type=email],
        .swagger-ui input[type=number],
        .swagger-ui select,
        .swagger-ui textarea {
            background: var(--input);
            color: var(--text);
            border: 1px solid var(--strong);
            border-radius: 7px;
            box-shadow: none
        }

        .swagger-ui input:disabled,
        .swagger-ui select:disabled,
        .swagger-ui textarea:disabled {
            background: var(--section);
            color: var(--muted);
            -webkit-text-fill-color: var(--muted);
            opacity: 1;
            cursor: not-allowed
        }

        .swagger-ui input::placeholder,
        .swagger-ui textarea::placeholder {
            color: var(--muted);
            opacity: 1
        }

        .swagger-ui input:focus,
        .swagger-ui select:focus,
        .swagger-ui textarea:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px
        }

        .swagger-ui .btn {
            background: var(--input);
            border: 1px solid var(--strong);
            color: var(--text);
            border-radius: 7px;
            box-shadow: none
        }

        .swagger-ui .btn.execute {
            background: #4f46e5;
            border-color: #6366f1;
            color: white
        }

        .swagger-ui .btn.authorize {
            color: var(--text);
            border-color: var(--strong)
        }

        .swagger-ui .responses {
            background: transparent;
            border-radius: 0
        }

        .swagger-ui section.models {
            margin: 8px 24px 24px;
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 10px
        }

        .swagger-ui section.models h4,
        .swagger-ui section.models h4 span {
            color: var(--text)
        }

        .swagger-ui section.models .model-container,
        .swagger-ui .model-box {
            background: var(--section)
        }

        .swagger-ui pre,
        .swagger-ui .highlight-code {
            background: var(--code) !important;
            color: var(--text) !important;
            border-radius: 8px
        }

        .swagger-ui .renderedMarkdown code {
            background: var(--code);
            color: var(--accent);
            padding: 2px 5px;
            border-radius: 4px
        }

        .swagger-ui .expand-operation svg,
        .swagger-ui .opblock-control-arrow svg,
        .swagger-ui .model-toggle svg,
        .swagger-ui .authorization__btn svg,
        .swagger-ui .btn.authorize svg,
        .swagger-ui section.models h4 svg {
            fill: var(--text)
        }

        .swagger-ui .dialog-ux .modal-ux {
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--strong);
            border-radius: 12px
        }

        .swagger-ui .dialog-ux .modal-ux-header {
            border-color: var(--line)
        }

        .swagger-ui .dialog-ux .modal-ux-header h3,
        .swagger-ui .dialog-ux .modal-ux-content h4,
        .swagger-ui .dialog-ux .modal-ux-content p {
            color: var(--text)
        }

        .swagger-ui .dialog-ux .modal-ux-header .close-modal svg {
            fill: var(--text)
        }

        @media(max-width:640px) {
            main {
                padding: 20px 12px 40px
            }

            .site-header {
                padding: 12px
            }

            .brand small {
                display: none
            }

            .actions {
                gap: 6px
            }

            .site-button {
                padding: 8px;
                font-size: 12px
            }

            .swagger-ui .info,
            .swagger-ui .scheme-container {
                padding: 20px 16px
            }

            .swagger-ui .opblock-tag-section {
                padding-inline: 12px
            }

            .swagger-ui .opblock .opblock-summary {
                padding: 12px;
                flex-wrap: wrap;
                gap: 8px
            }

            .swagger-ui .opblock-summary-description {
                flex-basis: 100%
            }

            .swagger-ui .parameters-container,
            .swagger-ui .opblock .responses-inner {
                overflow-x: auto
            }

            .swagger-ui section.models {
                margin-inline: 12px
            }
        }
    </style>
</head>

<body>
    <header class="site-header">
        <div class="brand"><span class="mark" aria-hidden="true">GF</span>
            <div><strong>Geo Fencing API</strong><small>Developer documentation</small></div>
        </div>
        <div class="actions"><a class="site-button" href="./swagger.yaml" target="_blank" rel="noopener">Open
                YAML</a><button class="site-button" id="theme-toggle" type="button">Light mode</button></div>
    </header>
    <main>
        <section class="hero"><span class="eyebrow">API REFERENCE</span>
            <h1>Geo Fencing API</h1>
            <p>เอกสาร API สำหรับตรวจสอบ endpoints, parameters และ response schemas</p>
        </section>
        <section class="docs" aria-label="API documentation">
            <div id="load-error" role="alert" hidden></div>
            <div id="swagger-ui"></div>
        </section>
    </main>
    <script>
        (function () {
            const key = 'geo-api-docs-theme';
            const button = document.getElementById('theme-toggle');
            function apply(theme) { document.documentElement.dataset.theme = theme; button.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode'; button.setAttribute('aria-label', theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'); }
            let theme = 'dark'; try { const saved = localStorage.getItem(key); if (saved === 'light' || saved === 'dark') theme = saved; } catch (e) { }
            apply(theme);
            button.addEventListener('click', function () { const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; apply(next); try { localStorage.setItem(key, next); } catch (e) { } });
            window.showDocsError = function (message) { const box = document.getElementById('load-error'); box.textContent = message; box.hidden = false; };
        })();
    </script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"
        onerror="showDocsError('โหลด Swagger UI ไม่สำเร็จ กรุณาตรวจสอบการเชื่อมต่อกับ unpkg.com แล้วโหลดหน้าใหม่')"></script>
    <script>
        if (typeof SwaggerUIBundle === 'function') {
            try { window.ui = SwaggerUIBundle({ url: './swagger.yaml', dom_id: '#swagger-ui', deepLinking: true, presets: [SwaggerUIBundle.presets.apis], layout: 'BaseLayout', persistAuthorization: false }); }
            catch (error) { showDocsError('เริ่มต้น Swagger UI ไม่สำเร็จ: ' + error.message); }
        }
    </script>
</body>

</html>
